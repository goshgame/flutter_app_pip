name: flutter_app_pip
description: A local Flutter plugin for in-app overlay PiP and system Picture-in-Picture.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.gosh.flutter_app_pip
        pluginClass: FlutterAppPipPlugin
      ios:
        pluginClass: FlutterAppPipPlugin
